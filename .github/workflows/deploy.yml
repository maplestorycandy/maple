name: "Deploy Godot 4 Web to GitHub Pages"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export_and_deploy:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Web Directory
        run: |
          mkdir -v -p build/web

      - name: Export Godot Web Project
        run: |
          godot -v --headless --export-release "Web" build/web/index.html

      - name: Add Service Worker for COOP/COEP
        run: |
          cp coi-serviceworker.js build/web/coi-serviceworker.js || true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to gh-pages branch (Branch Support)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages

  deploy_to_pages:
    needs: export_and_deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
